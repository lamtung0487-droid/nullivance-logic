name: Reproducibility gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install publication dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          python3 texlive-latex-base texlive-latex-extra
          texlive-fonts-recommended lmodern poppler-utils
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Nullivance
          build: true
          use-mathlib-cache: true
      - name: Verify the complete research collection
        run: python3 scripts/Verify-ResearchPublication.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nullivance-publication-checks
          if-no-files-found: warn
          path: |
            output/publication-dr0149/
            papers/npl-core/main.pdf
            papers/npl-finite-fo/main.pdf
            papers/npl-research-2026/main.pdf
