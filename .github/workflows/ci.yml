name: Reproducibility gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Nullivance
          build: true
          use-mathlib-cache: true
          # lean-action's nanoda wrapper currently expects a legacy [package]
          # table and cannot infer the module from Lake's current TOML syntax.
          # The repository gate below independently rejects proof holes and
          # undeclared/custom axioms after the complete Lake build succeeds.
      - name: Metadata, status, and source gates
        shell: pwsh
        run: ./scripts/Verify-Release.ps1 -SkipLeanBuild -SkipPdfBuild

  papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - name: Build both manuscripts
        shell: pwsh
        run: ./scripts/Build-Papers.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nullivance-manuscripts
          path: |
            papers/npl-core/main.pdf
            papers/npl-finite-fo/main.pdf
